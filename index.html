<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nurse Libya 🇱🇾</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    :root {
      --bg: #f5f8fb;
      --card: #ffffff;
      --primary: #18a7ff;
      --primary-dark: #0788d6;
      --green: #21b573;
      --red: #ef4444;
      --text: #102033;
      --muted: #718096;
      --border: #e5eaf0;
      --shadow: 0 8px 25px rgba(15, 35, 55, 0.08);
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      background: var(--bg);
      padding-bottom: 90px;
    }

    /* HEADER */

    header {
      background: linear-gradient(135deg, #071b30, #0d2d4b);
      color: white;
      padding: 22px 18px 28px;
      border-radius: 0 0 28px 28px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: white;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 27px;
      font-weight: 900;
    }

    .brand h1 {
      font-size: 21px;
      font-weight: 800;
    }

    .brand p {
      font-size: 12px;
      opacity: .75;
      margin-top: 2px;
    }

    .notification {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      color: white;
      font-size: 21px;
    }

    .welcome {
      margin-bottom: 18px;
    }

    .welcome small {
      opacity: .75;
      font-size: 14px;
    }

    .welcome h2 {
      margin-top: 5px;
      font-size: 27px;
      font-weight: 850;
    }

    .search {
      height: 54px;
      background: white;
      border-radius: 17px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      color: #8b98a8;
    }

    .search input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text);
      background: transparent;
      direction: rtl;
    }

    /* CONTENT */

    main {
      padding: 20px 16px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0 14px;
    }

    .section-title h3 {
      font-size: 20px;
      font-weight: 850;
    }

    .section-title a {
      color: var(--primary);
      font-size: 13px;
      text-decoration: none;
    }

    /* QUICK ACTIONS */

    .quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-bottom: 24px;
    }

      background: var(--card);
