<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nurse Libya</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 15px; background: #f4f7f6; text-align: center; }
    .card { background: white; border-radius: 10px; padding: 20px; max-width: 400px; margin: 20px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { width: 95%; padding: 10px; background: #082d59; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h2>Nurse Libya 🇱🇾</h2>

  <div class="card">
    <h3>تسجيل الدخول / حساب جديد</h3>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="handleAuth()">دخول / إنشاء حساب</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://qlgxpdtryysmrpevjudi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_mZFylkfh8cNR7yeAxIWngQ_n8lu1N8k';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleAuth() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert('الرجاء إدخال البريد وكلمة المرور');
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({ email, password });

      if (error) {
        const { data: logData, error: logError } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (logError) alert('خطأ: ' + logError.message);
        else alert('تم تسجيل الدخول بنجاح!');
      } else {
        alert('تم إنشاء الحساب بنجاح!');
      }
    }
  </script>
</body>
</html>
