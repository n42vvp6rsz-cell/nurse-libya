<script>
  // ================================
  // SUPABASE - NURSE LIBYA
  // ================================

  const SUPABASE_URL = "https://juxiaorwaiazfjlmkcvm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_TRboilZah9KxLKNskvtO8g_y24KpDpc";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  // ================================
  // بيانات التطبيق
  // ================================

  let currentUser = null;
  let bookings = [];

  // ================================
  // تسجيل الدخول
  // ================================

  async function login() {
    const email = document
      .getElementById("loginEmail")
      .value
      .trim();

    const password = document
      .getElementById("loginPassword")
      .value
      .trim();

    if (!email || !password) {
      showToast("يرجى إدخال البريد وكلمة المرور");
      return;
    }

    showToast("جاري تسجيل الدخول...");

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      showToast(error.message);
      return;
    }

    currentUser = data.user;

    await loadProfile();
    await loadBookings();

    updateUserUI();

    showToast("تم تسجيل الدخول بنجاح ✓");

    setTimeout(() => {
      showScreen("homeScreen");
    }, 500);
  }

  // ================================
  // إنشاء حساب
  // ================================

  async function register() {

    const name =
      document.getElementById("registerName").value.trim();

    const phone =
      document.getElementById("registerPhone").value.trim();

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value.trim();

    const role =
      document.getElementById("registerRole").value;

    if (!name || !phone || !email || !password) {
      showToast("يرجى تعبئة جميع البيانات");
      return;
    }

    showToast("جاري إنشاء الحساب...");

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: name,
            phone: phone,
            role: role
          }
        }
      });

    if (error) {
      showToast(error.message);
      return;
    }

    if (!data.user) {
      showToast("حدث خطأ أثناء إنشاء الحساب");
      return;
    }

    currentUser = data.user;

    showToast(
      "تم إنشاء الحساب بنجاح 🎉 تحقق من بريدك الإلكتروني إذا طلب منك ذلك"
    );

    setTimeout(() => {
      showScreen("loginScreen");
    }, 1500);
  }

  // ================================
  // تحميل البروفايل
  // ================================

  async function loadProfile() {

    if (!currentUser) return;

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();

    if (data && !error) {
      currentUser = {
        ...currentUser,
        name: data.full_name,
        phone: data.phone,
        role: data.role
      };
    } else {

      currentUser = {
        ...currentUser,
        name:
          currentUser.user_metadata?.full_name ||
          currentUser.email.split("@")[0],

        phone:
          currentUser.user_metadata?.phone || "",

        role:
          currentUser.user_metadata?.role || "patient"
      };
    }
  }

  // ================================
  // تحديث الواجهة
  // ================================

  function updateUserUI() {

    if (!currentUser) return;

    const name =
      currentUser.name ||
      currentUser.email?.split("@")[0] ||
      "مستخدم";

    document.getElementById("welcomeName").textContent =
      "أهلاً " + name + " 👋";

    document.getElementById("profileName").textContent =
      name;

    document.getElementById("profileEmail").textContent =
      currentUser.email || "";

    document.getElementById("bookingName").value =
      name;

    document.getElementById("bookingPhone").value =
      currentUser.phone || "";
  }

  // ================================
  // تسجيل الخروج
  // ================================

  async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;
    bookings = [];

    showToast("تم تسجيل الخروج");

    setTimeout(() => {
      showScreen("loginScreen");
    }, 500);
  }

  // ================================
  // فتح الحجز
  // ================================

  function openBooking(service) {

    document.getElementById("bookingService").value =
      service;

    updateUserUI();

    showScreen("bookingScreen");
  }

  // ================================
  // تأكيد الحجز
  // ================================

  async function confirmBooking() {

    if (!currentUser) {
      showToast("يرجى تسجيل الدخول أولاً");
      showScreen("loginScreen");
      return;
    }

    const service =
      document.getElementById("bookingService").value;

    const name =
      document.getElementById("bookingName").value.trim();

    const phone =
      document.getElementById("bookingPhone").value.trim();

    const date =
      document.getElementById("bookingDate").value;

    const notes =
      document.getElementById("bookingNotes").value.trim();

    if (!service || !name || !phone || !date) {
      showToast("يرجى إدخال جميع بيانات الحجز");
      return;
    }

    showToast("جاري إرسال طلب الحجز...");

    const { error } =
      await supabaseClient
        .from("bookings")
        .insert({
          user_id: currentUser.id,
          service: service,
          patient_name: name,
          phone: phone,
          booking_date: date,
          notes: notes,
          status: "pending"
        });

    if (error) {
      showToast("خطأ: " + error.message);
      return;
    }

    showToast("تم إرسال طلب الحجز بنجاح ✓");

    document.getElementById("bookingDate").value = "";
    document.getElementById("bookingNotes").value = "";

    await loadBookings();

    setTimeout(() => {
      showScreen("bookingsScreen");
    }, 700);
  }

  // ================================
  // تحميل الحجوزات
  // ================================

  async function loadBookings() {

    if (!currentUser) {
      bookings = [];
      return;
    }

    const { data, error } =
      await supabaseClient
        .from("bookings")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", {
          ascending: false
        });

    if (!error) {
      bookings = data || [];
    }
  }

  // ================================
  // عرض الحجوزات
  // ================================

  function renderBookings() {

    const list =
      document.getElementById("bookingsList");

    if (!bookings.length) {

      list.innerHTML = `
        <div class="empty">
          <div>📅</div>
          <h3>لا توجد حجوزات</h3>
          <p>احجز خدمة تمريضية وستظهر هنا</p>
        </div>
      `;

      return;
    }

    list.innerHTML =
      bookings.map(booking => {

        const statusText =
          booking.status === "pending"
            ? "قيد المراجعة"
            : booking.status === "confirmed"
            ? "تم التأكيد"
            : booking.status === "completed"
            ? "مكتمل"
            : booking.status;

        return `
          <div class="list-card">

            <div class="list-icon">📅</div>

            <div class="list-info">

              <h3>${booking.service}</h3>

              <p>
                ${booking.booking_date}
                •
                ${statusText}
              </p>

            </div>

          </div>
        `;

      }).join("");
  }

  // ================================
  // تشغيل التطبيق
  // ================================

  window.onload = async function () {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session?.user) {

      currentUser = session.user;

      await loadProfile();
      await loadBookings();

      updateUserUI();

      showScreen("homeScreen");

    } else {

      showScreen("loginScreen");

    }

  };
</script>
